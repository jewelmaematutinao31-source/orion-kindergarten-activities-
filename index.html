<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#3f7d45">
<title>Orion's Kindergarten Safari 🦁</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  font-family:"Comic Sans MS","Trebuchet MS",sans-serif;
  background:#e9f7df;
  color:#29452d;
}

body{
  overflow-x:hidden;
}

button{
  font-family:inherit;
  cursor:pointer;
  border:0;
}

.topbar{
  position:sticky;
  top:0;
  z-index:1000;
  background:#3f7d45;
  color:white;
  padding:10px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  box-shadow:0 3px 10px #0002;
}

.top-title{
  font-size:18px;
  font-weight:bold;
}

.top-actions{
  display:flex;
  gap:6px;
}

.small-btn{
  background:#fff;
  color:#315f35;
  border-radius:14px;
  padding:8px 11px;
  font-size:13px;
  font-weight:bold;
}

.screen{
  display:none;
  min-height:calc(100vh - 58px);
  padding:18px;
}

.screen.active{
  display:flex;
  flex-direction:column;
  align-items:center;
}

.home{
  justify-content:center;
  text-align:center;
  background:
    radial-gradient(circle at 15% 20%,#fff9 0 35px,transparent 36px),
    radial-gradient(circle at 85% 15%,#fff9 0 30px,transparent 31px),
    linear-gradient(#cdeeb5,#f7f1c5);
}

.home-animal{
  font-size:85px;
  animation:bounce 2s infinite;
}

h1{
  font-size:38px;
  margin:8px 0;
  color:#3d713e;
}

h2{
  font-size:29px;
  margin:8px 0 16px;
}

.subtitle{
  font-size:19px;
  max-width:650px;
  margin:5px auto 20px;
}

.big-start{
  background:#f5a623;
  color:white;
  font-size:27px;
  font-weight:bold;
  padding:18px 45px;
  border-radius:30px;
  box-shadow:0 6px 0 #c97b0b;
}

.big-start:active{
  transform:translateY(4px);
  box-shadow:0 2px 0 #c97b0b;
}

.menu-screen{
  background:
    linear-gradient(#e8f8d9,#fff7cf);
}

.menu-title{
  text-align:center;
  margin-bottom:5px;
}

.menu-subtitle{
  text-align:center;
  font-size:17px;
  margin:0 0 16px;
}

.menu-grid{
  width:min(1000px,100%);
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(145px,1fr));
  gap:12px;
  padding-bottom:20px;
}

.game-button{
  min-height:125px;
  border-radius:24px;
  background:white;
  box-shadow:0 5px 12px #0002;
  border:4px solid #d8ebc9;
  padding:10px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;
  font-weight:bold;
  color:#355f38;
  transition:.15s;
}

.game-button:active{
  transform:scale(.95);
}

.game-icon{
  font-size:45px;
}

.game-name{
  font-size:16px;
}

.everything{
  grid-column:1/-1;
  background:#f5a623;
  color:white;
  border-color:#df8d11;
  min-height:90px;
}

.everything .game-icon{
  font-size:38px;
}

.activity-screen{
  background:
    radial-gradient(circle at 10% 15%,#fff8 0 25px,transparent 26px),
    radial-gradient(circle at 90% 20%,#fff8 0 32px,transparent 33px),
    linear-gradient(#e9f7df,#fff8d7);
}

.activity-header{
  width:min(1000px,100%);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-bottom:8px;
}

.activity-title{
  font-size:25px;
  font-weight:bold;
}

.progress-wrap{
  width:min(1000px,100%);
  height:15px;
  background:#d2dfcf;
  border-radius:20px;
  overflow:hidden;
  margin-bottom:14px;
}

.progress{
  height:100%;
  width:0%;
  background:#69a84f;
  transition:.3s;
}

.question{
  width:min(1000px,100%);
  background:#ffffffdd;
  border-radius:30px;
  padding:18px;
  box-shadow:0 5px 15px #0002;
  text-align:center;
}

.question-text{
  font-size:29px;
  font-weight:bold;
  margin-bottom:12px;
}

.choices{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(125px,1fr));
  gap:12px;
  width:100%;
}

.choice{
  min-height:105px;
  border-radius:22px;
  background:#fff;
  border:4px solid #d9e9cf;
  box-shadow:0 4px 8px #0002;
  font-size:24px;
  font-weight:bold;
  color:#345b37;
  padding:10px;
}

.choice:active{
  transform:scale(.95);
}

.emoji-choice{
  font-size:58px;
}

.correct{
  animation:correct .55s ease;
  background:#d9f7c9 !important;
  border-color:#62a94c !important;
}

.wrong{
  animation:shake .35s ease;
  background:#ffdcdc !important;
  border-color:#e78a8a !important;
}

.feedback{
  min-height:38px;
  font-size:23px;
  font-weight:bold;
  margin-top:10px;
}

.activity-bottom{
  width:min(1000px,100%);
  display:flex;
  justify-content:center;
  gap:10px;
  margin-top:12px;
  flex-wrap:wrap;
}

.back-btn{
  background:#fff;
  color:#466b49;
  padding:11px 18px;
  border-radius:20px;
  font-weight:bold;
  box-shadow:0 3px 8px #0002;
}

.listen-btn{
  background:#8b6bb7;
  color:white;
  padding:11px 18px;
  border-radius:20px;
  font-weight:bold;
}

.visual{
  font-size:110px;
  line-height:1;
  margin:5px;
}

.color-box{
  width:145px;
  height:145px;
  border-radius:28px;
  margin:10px auto 20px;
  box-shadow:inset 0 0 0 6px #ffffffaa,0 5px 12px #0002;
}

.shape{
  width:140px;
  height:140px;
  margin:10px auto 20px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:70px;
}

.count-items{
  min-height:125px;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-wrap:wrap;
  gap:5px;
  font-size:55px;
  max-width:800px;
  margin:0 auto 12px;
}

.letter{
  font-size:100px;
  font-weight:bold;
  color:#e68a27;
}

.food-pair{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:18px;
  font-size:80px;
  margin:8px;
}

.line-board{
  width:min(850px,100%);
  background:#fff;
  border-radius:25px;
  padding:12px;
  box-shadow:0 4px 10px #0002;
  position:relative;
}

canvas{
  width:100%;
  height:310px;
  background:
    radial-gradient(circle,#dbead2 1px,transparent 1px);
  background-size:20px 20px;
  border:3px dashed #91b985;
  border-radius:18px;
  touch-action:none;
}

.draw-instructions{
  font-size:20px;
  font-weight:bold;
  margin:5px;
}

.clear-btn{
  background:#e77d67;
  color:white;
  padding:10px 18px;
  border-radius:18px;
  font-weight:bold;
  margin-top:8px;
}

.big-small-area{
  display:flex;
  align-items:flex-end;
  justify-content:center;
  gap:55px;
  min-height:210px;
}

.big-object{
  font-size:150px;
}

.small-object{
  font-size:65px;
}

.tall-tree{
  font-size:150px;
}

.pattern{
  font-size:70px;
  letter-spacing:8px;
  margin:20px;
}

.missing{
  color:#e68a27;
  font-size:70px;
  font-weight:bold;
}

.safari{
  width:min(1100px,100%);
  min-height:430px;
  border-radius:30px;
  overflow:hidden;
  position:relative;
  background:
    linear-gradient(#8ed5ed 0 42%,#9bd36d 42% 100%);
  border:6px solid #78a85c;
  box-shadow:0 6px 15px #0002;
}

.sun{
  position:absolute;
  right:30px;
  top:20px;
  font-size:70px;
}

.cloud{
  position:absolute;
  font-size:55px;
}

.cloud.one{left:8%;top:25px;}
.cloud.two{left:48%;top:55px;}

.tree{
  position:absolute;
  bottom:20px;
  font-size:85px;
}

.tree.t1{left:10px;}
.tree.t2{right:15px;}
.tree.t3{left:43%;bottom:0;}

.safari-object{
  position:absolute;
  border:0;
  background:transparent;
  font-size:55px;
  padding:3px;
  z-index:5;
  transition:.15s;
}

.safari-object:active{
  transform:scale(1.25);
}

.safari-instruction{
  font-size:23px;
  font-weight:bold;
  margin:5px 0 10px;
}

.celebration{
  justify-content:center;
  text-align:center;
  background:
    radial-gradient(circle at 20% 20%,#ffeb88 0 25px,transparent 26px),
    radial-gradient(circle at 80% 30%,#b8e7ff 0 30px,transparent 31px),
    linear-gradient(#dff7ce,#fff2c4);
}

.trophy{
  font-size:100px;
  animation:bounce 1s infinite;
}

.confetti{
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
  z-index:5000;
}

.confetti span{
  position:absolute;
  top:-30px;
  font-size:28px;
  animation:fall 3s linear forwards;
}

.finish-buttons{
  display:flex;
  gap:12px;
  justify-content:center;
  flex-wrap:wrap;
}

@keyframes bounce{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-12px)}
}

@keyframes correct{
  0%{transform:scale(1)}
  50%{transform:scale(1.08)}
  100%{transform:scale(1)}
}

@keyframes shake{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-8px)}
  75%{transform:translateX(8px)}
}

@keyframes fall{
  to{
    transform:translateY(110vh) rotate(720deg);
  }
}

@media(max-width:600px){
  h1{font-size:31px}
  h2{font-size:25px}
  .subtitle{font-size:16px}
  .question-text{font-size:24px}
  .activity-title{font-size:19px}
  .visual{font-size:85px}
  .choice{min-height:88px;font-size:19px}
  .emoji-choice{font-size:45px}
  .menu-grid{grid-template-columns:repeat(2,1fr)}
  .game-button{min-height:110px}
  .game-icon{font-size:38px}
  .safari{min-height:380px}
  .safari-object{font-size:44px}
  canvas{height:270px}
}

@media(orientation:landscape) and (max-height:600px){
  .screen{
    min-height:calc(100vh - 50px);
    padding:10px;
  }

  .question{
    padding:10px;
  }

  .question-text{
    font-size:23px;
    margin-bottom:5px;
  }

  .choice{
    min-height:65px;
    padding:5px;
  }

  .visual{
    font-size:70px;
  }

  .color-box{
    width:90px;
    height:90px;
    margin:3px auto 8px;
  }

  .menu-grid{
    grid-template-columns:repeat(4,1fr);
  }

  .game-button{
    min-height:82px;
  }

  .game-icon{
    font-size:30px;
  }

  .game-name{
    font-size:13px;
  }
}
</style>
</head>

<body>

<div class="topbar">
  <div class="top-title">🦁 Orion's Kindergarten Safari</div>

  <div class="top-actions">
    <button class="small-btn" onclick="goMenu()">🏠 Menu</button>
    <button class="small-btn" onclick="goFullscreen()">⛶</button>
    <button class="small-btn" onclick="rotateScreen()">↔️</button>
  </div>
</div>

<!-- HOME -->
<section id="home" class="screen home active">
  <div class="home-animal">🦁</div>

  <h1>Orion's Safari!</h1>

  <div class="subtitle">
    Let's learn, play, tap, match, count and explore! 🌿🐘🦒
  </div>

  <button class="big-start" onclick="showMenu()">
    🌟 START PLAYING
  </button>
</section>

<!-- MENU -->
<section id="menu" class="screen menu-screen">

  <h1 class="menu-title">🌟 What Do You Want To Play?</h1>

  <p class="menu-subtitle">
    Choose a game, Orion! 👆
  </p>

  <div class="menu-grid">

    <button class="game-button" onclick="startCategory('body')">
      <div class="game-icon">👦</div>
      <div class="game-name">Body Parts</div>
    </button>

    <button class="game-button" onclick="startCategory('colors')">
      <div class="game-icon">🌈</div>
      <div class="game-name">Colors</div>
    </button>

    <button class="game-button" onclick="startCategory('shapes')">
      <div class="game-icon">🔷</div>
      <div class="game-name">Shapes</div>
    </button>

    <button class="game-button" onclick="startCategory('counting')">
      <div class="game-icon">🔢</div>
      <div class="game-name">Counting</div>
    </button>

    <button class="game-button" onclick="startCategory('animals')">
      <div class="game-icon">🐾</div>
      <div class="game-name">Find Animals</div>
    </button>

    <button class="game-button" onclick="startCategory('sounds')">
      <div class="game-icon">🔊</div>
      <div class="game-name">Animal Sounds</div>
    </button>

    <button class="game-button" onclick="startCategory('food')">
      <div class="game-icon">🥕</div>
      <div class="game-name">What Do Animals Eat?</div>
    </button>

    <button class="game-button" onclick="startCategory('drawing')">
      <div class="game-icon">✏️</div>
      <div class="game-name">Draw a Line</div>
    </button>

    <button class="game-button" onclick="startCategory('letters')">
      <div class="game-icon">🔤</div>
      <div class="game-name">Letters</div>
    </button>

    <button class="game-button" onclick="startCategory('bigsmall')">
      <div class="game-icon">📏</div>
      <div class="game-name">Big or Small?</div>
    </button>

    <button class="game-button" onclick="startCategory('matching')">
      <div class="game-icon">🧩</div>
      <div class="game-name">Matching</div>
    </button>

    <button class="game-button" onclick="startCategory('missing')">
      <div class="game-icon">🧠</div>
      <div class="game-name">What's Missing?</div>
    </button>

    <button class="game-button" onclick="startCategory('hunt')">
      <div class="game-icon">🌿</div>
      <div class="game-name">Safari Hunt</div>
    </button>

    <button class="game-button everything" onclick="startEverything()">
      <div class="game-icon">🎮✨</div>
      <div class="game-name">PLAY EVERYTHING!</div>
    </button>

  </div>
</section>

<!-- ACTIVITY -->
<section id="activity" class="screen activity-screen">

  <div class="activity-header">
    <div id="activityTitle" class="activity-title">
      🦁 Safari Game
    </div>
  </div>

  <div class="progress-wrap">
    <div id="progress" class="progress"></div>
  </div>

  <div id="question" class="question"></div>

  <div class="activity-bottom">
    <button class="back-btn" onclick="goMenu()">🏠 Choose Another Game</button>
    <button class="listen-btn" onclick="speakCurrent()">🔊 Listen</button>
  </div>

</section>

<!-- CELEBRATION -->
<section id="celebration" class="screen celebration">

  <div class="trophy">🏆</div>

  <h1 id="celebrationTitle">🎉 GOOD JOB, ORION! 🎉</h1>

  <p id="celebrationText" class="subtitle">
    You finished your safari!
  </p>

  <div class="finish-buttons">
    <button class="big-start" onclick="goMenu()">
      🦁 Choose Another Game
    </button>

    <button class="big-start" onclick="startEverything()">
      🎮 Play Everything Again
    </button>
  </div>

  <div id="confetti" class="confetti"></div>

</section>

  "missing",
  "hunt"
];

function hideAll(){
  document.querySelectorAll(".screen").forEach(s=>{
    s.classList.remove("active");
  });
}

function showMenu(){
  hideAll();
  document.getElementById("menu").classList.add("active");
}

function goMenu(){
  hideAll();
  document.getElementById("menu").classList.add("active");
  stopSpeech();
}

function startCategory(category){
  currentCategory=category;
  playEverything=false;
  activityIndex=0;
  currentQuestion=0;
  startActivity();
}

function startEverything(){
  playEverything=true;
  activityIndex=0;
  currentQuestion=0;
  currentCategory=everythingList[0];
  startActivity();
}

function startActivity(){

  hideAll();

  document.getElementById("activity").classList.add("active");

  currentQuestion=0;

  document.getElementById("activityTitle").textContent =
    categories[currentCategory].title;

  renderQuestion();
}

function renderQuestion(){

  const data=categories[currentCategory];
  const item=data.items[currentQuestion];

  currentSpeech="";

  document.getElementById("progress").style.width =
    ((currentQuestion+1)/data.items.length*100)+"%";

  const box=document.getElementById("question");

  if(data.type==="body"){
    renderBody(box,item);
  }

  else if(data.type==="colors"){
    renderColor(box,item);
  }

  else if(data.type==="shapes"){
    renderShape(box,item);
  }

  else if(data.type==="counting"){
    renderCounting(box,item);
  }

  else if(data.type==="animals"){
    renderAnimals(box,item);
  }

  else if(data.type==="sounds"){
    renderSounds(box,item);
  }

  else if(data.type==="food"){
    renderFood(box,item);
  }

  else if(data.type==="drawing"){
    renderDrawing(box,item);
  }

  else if(data.type==="letters"){
    renderLetters(box,item);
  }

  else if(data.type==="bigsmall"){
    renderBigSmall(box,item);
  }

  else if(data.type==="matching"){
    renderMatching(box,item);
  }

  else if(data.type==="missing"){
    renderMissing(box,item);
  }

  else if(data.type==="hunt"){
    renderHunt(box,item);
  }
}

/* BODY PARTS */

function renderBody(box,item){

  const name=item[0];

  currentSpeech="Where is your "+name+"?";

  let options=[
    item,
    randomBodyOption(name),
    randomBodyOption(name),
    randomBodyOption(name)
  ];

  options=uniqueBody(options,name);

  shuffle(options);

  box.innerHTML=`
    <div class="question-text">Where is your ${name}? 👆</div>
    <div class="visual">${item[1]}</div>
    <div class="choices">
      ${options.map((x,i)=>`
        <button class="choice emoji-choice"
          onclick="answerBody('${x[0]}',this,'${name}')">
          ${x[1]}
        </button>
      `).join("")}
    </div>
    <div class="feedback" id="feedback"></div>
  `;
}

function randomBodyOption(correct){

  let list=categories.body.items
    .filter(x=>x[0]!==correct);

  return list[Math.floor(Math.random()*list.length)];
}

function uniqueBody(options,correct){

  let result=[];
  let used=new Set();

  for(let x of options){
    if(!used.has(x[0])){
      used.add(x[0]);
      result.push(x);
    }
  }

  while(result.length<4){
    let x=randomBodyOption(correct);

    if(!used.has(x[0])){
      used.add(x[0]);
      result.push(x);
    }
  }

  return result;
}

function answerBody(value,button,correct){

  if(value===correct){
    correctAnswer(button,"Yes! That's your "+correct+"! 👏");
  }else{
    wrongAnswer(button);
  }
}

      🧹 Clear
    </button>

      class="big-start"
      style="font-size:20px;margin-top:12px;padding:12px 28px"

    </button>

let canvas;
let ctx;
let drawing=false;
let hasDrawn=false;

function setupCanvas(){

  canvas=document.getElementById("drawCanvas");

  if(!canvas)return;

  const rect=canvas.getBoundingClientRect();

  const ratio=window.devicePixelRatio||1;

  canvas.width=rect.width*ratio;
  canvas.height=rect.height*ratio;

  ctx=canvas.getContext("2d");

  ctx.scale(ratio,ratio);

  ctx.lineWidth=6;
  ctx.lineCap="round";
  ctx.lineJoin="round";
  ctx.strokeStyle="#4c8b4e";

  canvas.addEventListener("pointerdown",startDrawing);
  canvas.addEventListener("pointermove",drawLine);
  canvas.addEventListener("pointerup",stopDrawing);
  canvas.addEventListener("pointercancel",stopDrawing);
}

function pointerPosition(e){

  const rect=canvas.getBoundingClientRect();

  return {
    x:e.clientX-rect.left,
    y:e.clientY-rect.top
  };
}

function startDrawing(e){

  drawing=true;
  hasDrawn=true;

  const p=pointerPosition(e);

  ctx.beginPath();
  ctx.moveTo(p.x,p.y);
}

function drawLine(e){

  if(!drawing)return;

  const p=pointerPosition(e);

  ctx.lineTo(p.x,p.y);
  ctx.stroke();
}

function stopDrawing(){
  drawing=false;
}

function clearCanvas(){

  if(!canvas||!ctx)return;

  const rect=canvas.getBoundingClientRect();

  ctx.clearRect(0,0,rect.width,rect.height);

  hasDrawn=false;
}

function finishDrawing(){

  if(!hasDrawn){

    document.getElementById("feedback").textContent=
      "Try drawing a line first! ✏️";

    return;
  }

  correctAnswer(null,"Great drawing, Orion! 🎨👏");
}

function escapeQuotes(x){
  return x.replace(/'/g,"\\'");
}

function huntAnswer(value,button,correct){

  if(value===correct){

    button.classList.add("correct");

    document.getElementById("feedback").textContent=
      "You found it! 🎉👏";

    setTimeout(nextQuestion,850);

  }else{

    button.classList.add("wrong");

    document.getElementById("feedback").textContent=
      "Keep looking! 👀🌿";

    setTimeout(()=>{
      button.classList.remove("wrong");
    },450);
  }
}

/* ANSWERS */

function answerSimple(value,button,correct){

  if(String(value)===String(correct)){

    correctAnswer(button,"Great job, Orion! 🎉");

  }else{

    wrongAnswer(button);
  }
}

function correctAnswer(button,message){

  if(button){
    button.classList.add("correct");
    button.disabled=true;
  }

  const feedback=document.getElementById("feedback");

  if(feedback){
    feedback.textContent=message;
  }

  setTimeout(nextQuestion,850);
}

function wrongAnswer(button){

  button.classList.add("wrong");

  const feedback=document.getElementById("feedback");

  if(feedback){
    feedback.textContent="Try again! 💚";
  }

  setTimeout(()=>{
    button.classList.remove("wrong");
  },450);
}

/* NEXT */

  stopSpeech();

  const data=categories[currentCategory];

  currentQuestion++;

  if(currentQuestion<data.items.length){

  if(playEverything){

    activityIndex++;

      currentQuestion=0;

      setTimeout(startActivity,250);

    }else{

/* CONFETTI */

function makeConfetti(){

  const container=document.getElementById("confetti");

  container.innerHTML="";

  const pieces=[
    "🎉","⭐","🌟","🎈","🦁","🐘","🦒",
    "🍎","🍌","🌸","💚","💛","🎊"
  ];

  for(let i=0;i<55;i++){

    const span=document.createElement("span");

    span.textContent=
      pieces[Math.floor(Math.random()*pieces.length)];

    span.style.left=Math.random()*100+"%";

    span.style.animationDelay=
      Math.random()*1.8+"s";

    span.style.animationDuration=
      (2.2+Math.random()*2)+"s";

    container.appendChild(span);
  }
}

/* OPTIONS */

function makeOptions(list,correct){

  let options=[correct];

  while(options.length<4){

    let x=list[Math.floor(Math.random()*list.length)];

    if(!options.includes(x)){
      options.push(x);
    }
  }

  shuffle(options);

  return options;
}

function shuffle(array){

  for(let i=array.length-1;i>0;i--){

    const j=Math.floor(Math.random()*(i+1));

    [array[i],array[j]]=
      [array[j],array[i]];
  }

  return array;
}

/* SPEECH */

function speakCurrent(){

  if(!currentSpeech)return;

  stopSpeech();

  const utterance=
    new SpeechSynthesisUtterance(currentSpeech);

  utterance.rate=.8;
  utterance.pitch=1.2;

  speechSynthesis.speak(utterance);
}

function stopSpeech(){

  if("speechSynthesis" in window){
    speechSynthesis.cancel();
  }
}

/* FULLSCREEN */

function goFullscreen(){

  const element=document.documentElement;

  if(!document.fullscreenElement){

    if(element.requestFullscreen){

      element.requestFullscreen();

    }else if(element.webkitRequestFullscreen){

      element.webkitRequestFullscreen();
    }

  }else{

    if(document.exitFullscreen){

      document.exitFullscreen();

    }else if(document.webkitExitFullscreen){

      document.webkitExitFullscreen();
    }
  }
}

/* ROTATION */

async function rotateScreen(){

  try{

    if(screen.orientation && screen.orientation.lock){

      await screen.orientation.lock("landscape");

    }else{

      alert(
        "Please rotate your phone sideways for a bigger Safari screen! 🦁↔️"
      );
    }

  }catch(error){

    alert(
      "Please turn your phone sideways for the best Safari view! 🦁↔️"
    );
  }
}

/* INITIAL */

window.addEventListener("beforeunload",stopSpeech);
