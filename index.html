<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Orion's Kindergarten Safari 🦁</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  font-family:Arial, sans-serif;
  background:#f5f0d8;
}

body{
  overflow-x:hidden;
}

button{
  font-family:inherit;
  cursor:pointer;
  border:0;
}

.topbar{
  position:sticky;
  top:0;
  z-index:100;
  background:#2f6b3b;
  color:white;
  padding:10px 14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  box-shadow:0 2px 8px rgba(0,0,0,.2);
}

.logo{
  font-size:20px;
  font-weight:bold;
}

.top-buttons{
  display:flex;
  gap:6px;
}

.top-buttons button{
  background:white;
  color:#2f6b3b;
  border-radius:10px;
  padding:8px 10px;
  font-size:16px;
  font-weight:bold;
}

#app{
  min-height:calc(100vh - 58px);
  padding:14px;
}

.screen{
  max-width:1100px;
  margin:auto;
}

.hidden{
  display:none !important;
}

/* HOME */

.home{
  min-height:calc(100vh - 90px);
  display:flex;
  justify-content:center;
  align-items:center;
}

.home-card{
  width:100%;
  max-width:700px;
  text-align:center;
  background:#fffdf3;
  border-radius:30px;
  padding:28px 18px;
  box-shadow:0 8px 25px rgba(0,0,0,.12);
}

.big-lion{
  font-size:90px;
  animation:bounce 1.7s infinite;
}

.home h1{
  color:#2f6b3b;
  font-size:clamp(30px,7vw,55px);
  margin:10px 0;
}

.home p{
  font-size:20px;
  color:#555;
}

.start-btn{
  background:#f3a928;
  color:white;
  font-size:25px;
  font-weight:bold;
  padding:17px 35px;
  border-radius:20px;
  box-shadow:0 5px 0 #c97e10;
  margin-top:15px;
}

.start-btn:active{
  transform:translateY(4px);
  box-shadow:0 1px 0 #c97e10;
}

/* PROGRESS */

.progress-area{
  max-width:1100px;
  margin:0 auto 12px;
}

.progress-text{
  text-align:center;
  font-weight:bold;
  color:#2f6b3b;
  margin-bottom:5px;
}

.progress{
  height:13px;
  background:#ddd;
  border-radius:20px;
  overflow:hidden;
}

.progress-bar{
  height:100%;
  width:0%;
  background:#f3a928;
  transition:.4s;
}

/* ACTIVITY */

.activity-card{
  background:#fffdf3;
  border-radius:28px;
  padding:18px;
  box-shadow:0 7px 22px rgba(0,0,0,.12);
  text-align:center;
  min-height:calc(100vh - 125px);
}

.category{
  display:inline-block;
  background:#dcefd8;
  color:#2f6b3b;
  padding:7px 14px;
  border-radius:20px;
  font-weight:bold;
  margin-bottom:8px;
}

.question{
  font-size:clamp(25px,5vw,40px);
  font-weight:bold;
  color:#333;
  margin:8px auto 18px;
}

.instruction{
  font-size:19px;
  color:#666;
  margin-bottom:15px;
}

.visual{
  font-size:clamp(70px,17vw,150px);
  margin:5px auto 15px;
  min-height:120px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
}

/* CHOICES */

.choices{
  display:grid;
  grid-template-columns:repeat(2, minmax(120px,1fr));
  gap:12px;
  max-width:700px;
  margin:auto;
}

.choice{
  min-height:85px;
  border-radius:20px;
  background:#e8f1dc;
  color:#333;
  font-size:28px;
  font-weight:bold;
  padding:15px;
  box-shadow:0 4px 0 #b8c9a7;
  transition:.12s;
}

.choice:active{
  transform:translateY(4px);
  box-shadow:none;
}

.choice.correct{
  background:#9be28f !important;
}

.choice.wrong{
  background:#ffd0c8 !important;
}

/* COLOR CHOICES */

.color-choice{
  min-height:90px;
  border-radius:20px;
  border:5px solid white;
  box-shadow:0 3px 10px rgba(0,0,0,.18);
  color:white;
  font-size:0;
}

.color-label{
  font-size:18px;
  background:rgba(0,0,0,.35);
  border-radius:10px;
  padding:5px 10px;
}

/* FEEDBACK */

.feedback{
  min-height:45px;
  margin-top:15px;
  font-size:24px;
  font-weight:bold;
}

.good{
  color:#278b32;
}

.try{
  color:#d06c3b;
}

/* DRAWING */

.canvas-wrap{
  position:relative;
  width:100%;
  max-width:900px;
  height:min(52vh,480px);
  margin:10px auto;
  background:#dff3d7;
  border:5px solid #7bab67;
  border-radius:25px;
  overflow:hidden;
  touch-action:none;
}

.canvas-board{
  position:absolute;
  inset:0;
}

.animal-target{
  position:absolute;
  font-size:70px;
  z-index:2;
  user-select:none;
  pointer-events:none;
}

.mama{
  left:8%;
  top:35%;
}

.baby{
  right:8%;
  top:35%;
}

.target-label{
  position:absolute;
  font-size:18px;
  font-weight:bold;
  background:white;
  padding:5px 9px;
  border-radius:10px;
  z-index:3;
  pointer-events:none;
}

.mama-label{
  left:5%;
  top:18%;
}

.baby-label{
  right:5%;
  top:18%;
}

.draw-buttons{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}

.draw-buttons button{
  padding:12px 20px;
  border-radius:15px;
  font-size:18px;
  font-weight:bold;
  background:#e9b24c;
}

/* MATCHING */

.match-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
  max-width:650px;
  margin:auto;
}

.match-card{
  background:#edf5df;
  border-radius:20px;
  min-height:120px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:60px;
  box-shadow:0 4px 0 #b8c9a7;
}

/* SAFARI */

.safari{
  position:relative;
  width:100%;
  height:min(66vh,600px);
  min-height:430px;
  overflow:hidden;
  border-radius:28px;
  background:
    linear-gradient(#a9d9ef 0 42%, #79bd65 42% 100%);
  border:5px solid #638c51;
  margin:auto;
}

.sun{
  position:absolute;
  top:20px;
  right:25px;
  font-size:65px;
}

.cloud{
  position:absolute;
  font-size:50px;
  opacity:.9;
}

.cloud1{top:30px;left:15%;}
.cloud2{top:85px;left:48%;}

.tree{
  position:absolute;
  font-size:90px;
}

.tree1{bottom:20px;left:2%;}
.tree2{bottom:25px;right:2%;}
.tree3{bottom:120px;left:26%;font-size:65px;}
.tree4{bottom:100px;right:27%;font-size:70px;}

.pond{
  position:absolute;
  bottom:5%;
  left:38%;
  font-size:95px;
}

.safari-object{
  position:absolute;
  font-size:45px;
  padding:0;
  background:transparent;
  z-index:10;
  transition:.15s;
}

.safari-object:hover{
  transform:scale(1.15);
}

.safari-object.found{
  animation:found .6s;
}

.hint{
  margin-top:10px;
  font-size:18px;
  color:#555;
}

/* COMPLETION */

.complete{
  min-height:calc(100vh - 90px);
  display:flex;
  justify-content:center;
  align-items:center;
}

.complete-card{
  background:#fffdf3;
  text-align:center;
  padding:30px 18px;
  border-radius:30px;
  max-width:800px;
  width:100%;
  box-shadow:0 8px 25px rgba(0,0,0,.15);
  position:relative;
  z-index:20;
}

.complete-card h1{
  font-size:clamp(38px,8vw,70px);
  color:#2f6b3b;
  margin:10px;
}

.complete-card p{
  font-size:25px;
}

.trophy{
  font-size:90px;
}

.confetti{
  position:fixed;
  top:-20px;
  font-size:25px;
  z-index:9999;
  pointer-events:none;
  animation:fall 3s linear forwards;
}

/* ANIMATIONS */

@keyframes bounce{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-15px)}
}

@keyframes fall{
  to{
    transform:translateY(110vh) rotate(720deg);
  }
}

@keyframes found{
  50%{transform:scale(1.5)}
}

@media(max-width:600px){
  .choices{
    grid-template-columns:repeat(2,1fr);
  }

  .choice{
    min-height:75px;
    font-size:23px;
  }

  .visual{
    min-height:95px;
  }

  .safari{
    min-height:440px;
  }

  .safari-object{
    font-size:38px;
  }
}

@media(orientation:landscape) and (max-height:600px){
  .activity-card{
    min-height:calc(100vh - 80px);
  }

  .visual{
    font-size:80px;
    min-height:85px;
  }

  .question{
    font-size:28px;
    margin:5px;
  }

  .safari{
    height:72vh;
    min-height:300px;
  }
}
</style>
</head>

<body>

<div class="topbar">
  <div class="logo">🦁 Orion's Safari</div>

  <div class="top-buttons">
    <button onclick="goFullscreen()">⛶</button>
    <button onclick="rotateScreen()">🔄</button>
    <button onclick="speakCurrent()">🔊</button>
  </div>
</div>

<div id="app">

  <!-- HOME -->
  <section id="home" class="home screen">
    <div class="home-card">
      <div class="big-lion">🦁</div>
      <h1>Orion's Kindergarten Safari</h1>
      <p>Let's learn, play, find animals, count, draw and explore! 🌿</p>
      <button class="start-btn" onclick="startGame()">START! 🦁</button>
    </div>
  </section>

  <!-- GAME -->
  <section id="game" class="screen hidden">

    <div class="progress-area">
      <div id="progressText" class="progress-text"></div>
      <div class="progress">
        <div id="progressBar" class="progress-bar"></div>
      </div>
    </div>

    <div class="activity-card">

      <div id="category" class="category"></div>
      <div id="question" class="question"></div>
      <div id="instruction" class="instruction"></div>

      <div id="activityContent"></div>

      <div id="feedback" class="feedback"></div>

    </div>
  </section>

  <!-- COMPLETE -->
  <section id="complete" class="complete screen hidden">
    <div class="complete-card">
      <div class="trophy">🏆🦁🎉</div>
      <h1>GOOD JOB, ORION!</h1>
      <p>You finished your Kindergarten Safari! 🌿</p>
      <p>⭐ ⭐ ⭐ ⭐ ⭐</p>
      <button class="start-btn" onclick="restartGame()">PLAY AGAIN 🔄</button>
    </div>
  </section>

</div>

<script>

/* =========================================================
   ORION'S KINDERGARTEN SAFARI
========================================================= */

const activities = [];

/* =========================================================
   1. BODY PARTS
========================================================= */

const bodyParts = [
  ["Where is the nose?","👦",["Nose","Ear","Foot"],0],
  ["Where are the eyes?","👦",["Eyes","Hands","Feet"],0],
  ["Where are the ears?","👦",["Ears","Mouth","Tummy"],0],
  ["Where is the mouth?","👦",["Mouth","Hair","Neck"],0],
  ["Where are the teeth?","👦",["Teeth","Eyes","Hands"],0],
  ["Where is the head?","👦",["Head","Foot","Arm"],0],
  ["Where is the hair?","👦",["Hair","Tummy","Hand"],0],
  ["Where is the neck?","👦",["Neck","Ear","Foot"],0],
  ["Where are the arms?","👦",["Arms","Eyes","Toes"],0],
  ["Where are the hands?","👦",["Hands","Hair","Mouth"],0],
  ["Where are the fingers?","👦",["Fingers","Knees","Ears"],0],
  ["Where is the tummy?","👦",["Tummy","Head","Hand"],0],
  ["Where are the legs?","👦",["Legs","Ears","Hair"],0],
  ["Where are the feet?","👦",["Feet","Eyes","Neck"],0],
  ["Where are the toes?","👦",["Toes","Hands","Cheeks"],0],
  ["Where are the cheeks?","👦",["Cheeks","Feet","Arms"],0],
  ["Where is the chin?","👦",["Chin","Tummy","Legs"],0],
  ["Where is the bottom?","👦",["Bottom","Nose","Hair"],0]
];

bodyParts.forEach(x=>{
  activities.push({
    type:"choice",
    category:"👦 Body Parts",
    question:x[0],
    visual:x[1],
    choices:x[2],
    answer:x[3]
  });
});

/* =========================================================
   2. COLORS
========================================================= */

const colors = [
  ["Yellow","🟡","#f4d03f"],
  ["Blue","🔵","#3498db"],
  ["Green","🟢","#45a049"],
  ["Pink","🩷","#f38bbd"],
  ["Black","⚫","#222"],
  ["White","⚪","#ffffff"],
  ["Purple","🟣","#8e44ad"],
  ["Orange","🟠","#f39c12"],
  ["Red","🔴","#e74c3c"],
  ["Brown","🟤","#8b5a2b"]
];

colors.forEach((c,index)=>{
  activities.push({
    type:"color",
    category:"🌈 Colors",
    question:"Can you find " + c[0] + "?",
    answer:index,
    choices:colors.map(x=>x[0]),
    colorData:colors
  });
});

/* =========================================================
   3. SHAPES
========================================================= */

const shapes = [
  ["Circle","⚪"],
  ["Square","🟦"],
  ["Triangle","🔺"],
  ["Rectangle","▭"],
  ["Star","⭐"],
  ["Heart","❤️"]
];

shapes.forEach((s,index)=>{
  activities.push({
    type:"choice",
    category:"🔷 Shapes",
    question:"Can you find the " + s[0].toLowerCase() + "?",
    visual:s[1],
    choices:shapes.map(x=>x[0]),
    answer:index
  });
});

/* =========================================================
   4. COUNTING
========================================================= */

const counting = [
  ["How many apples?","🍎",2],
  ["How many chicks?","🐥",3],
  ["How many balloons?","🎈",4],
  ["How many stars?","⭐",5],
  ["How many fish?","🐟",6],
  ["How many butterflies?","🦋",7],
  ["How many bananas?","🍌",3],
  ["How many flowers?","🌸",5],
  ["How many ducks?","🦆",4],
  ["How many lions?","🦁",6]
];

counting.forEach(c=>{
  let objects="";
  for(let i=0;i<c[2];i++) objects+=c[1];

  const choices=[c[2]-1,c[2],c[2]+1];

  activities.push({
    type:"choice",
    category:"🔢 Counting",
    question:c[0],
    visual:objects,
    choices:choices.map(String),
    answer:1
  });
});

/* =========================================================
   5. ANIMALS
========================================================= */

const animals=[
  "🦁 Lion",
  "🐘 Elephant",
  "🦒 Giraffe",
  "🐒 Monkey",
  "🐼 Panda",
  "🐰 Rabbit",
  "🐶 Dog",
  "🐱 Cat",
  "🐴 Horse",
  "🐧 Penguin",
  "🐻‍❄️ Polar Bear",
  "🐦 Bird",
  "🐟 Fish",
  "🐝 Bee",
  "🦆 Duck",
  "🐔 Chicken",
  "🐆 Leopard",
  "🦓 Zebra"
];

animals.forEach((a,index)=>{
  activities.push({
    type:"choice",
    category:"🐾 Animals",
    question:"Can you find the " + a.substring(2).toLowerCase() + "?",
    visual:"🐾",
    choices:animals,
    answer:index
  });
});

/* =========================================================
   6. ANIMAL SOUNDS
========================================================= */

const sounds=[
  ["ROAR!","🦁 Lion",0],
  ["WOOF!","🐶 Dog",1],
  ["MEOW!","🐱 Cat",2],
  ["NEIGH!","🐴 Horse",3],
  ["QUACK!","🦆 Duck",4],
  ["BUZZ!","🐝 Bee",5],
  ["CLUCK!","🐔 Chicken",6],
  ["BIRD SOUND!","🐦 Bird",7]
];

sounds.forEach(s=>{
  activities.push({
    type:"choice",
    category:"🔊 Animal Sounds",
    question:"Who says " + s[0],
    visual:"🔊",
    choices:[
      "🦁 Lion",
      "🐶 Dog",
      "🐱 Cat",
      "🐴 Horse",
      "🦆 Duck",
      "🐝 Bee",
      "🐔 Chicken",
      "🐦 Bird"
    ],
    answer:s[2]
  });
});

/* =========================================================
   7. WHAT DOES THE ANIMAL EAT?
========================================================= */

const foods=[
  ["Rabbit","🐰","🥕",["🥕","🍌","🦴"]],
  ["Dog","🐶","🦴",["🍎","🦴","🥕"]],
  ["Monkey","🐒","🍌",["🍌","🦴","🌸"]],
  ["Panda","🐼","🎋",["🍎","🎋","🥕"]],
  ["Horse","🐴","🌿",["🦴","🌿","🍌"]],
  ["Fish","🐟","🪱",["🍌","🪱","🥕"]],
  ["Bee","🐝","🌸",["🌸","🦴","🍎"]]
];

foods.forEach(f=>{
  activities.push({
    type:"choice",
    category:"🥕 What Does It Eat?",
    question:"What does the " + f[0].toLowerCase() + " eat?",
    visual:f[1],
    choices:f[3],
    answer:f[3].indexOf(f[2])
  });
});

/* =========================================================
   8. DRAWING
========================================================= */

activities.push({
  type:"draw",
  category:"✏️ Draw a Line",
  question:"Help Mama Cat find her baby!",
  instruction:"Use your finger or stylus to draw a line from Mama Cat to Baby Cat."
});

activities.push({
  type:"draw",
  category:"✏️ Draw a Line",
  question:"Help Mama Dog find her puppy!",
  instruction:"Use your finger or stylus to draw a line from Mama Dog to the puppy."
});

/* =========================================================
   9. LETTERS
========================================================= */

const letters=[
  ["A","🍎"],
  ["B","🐝"],
  ["C","🐱"],
  ["D","🐶"],
  ["E","🐘"],
  ["F","🐟"]
];

letters.forEach((l,index)=>{
  activities.push({
    type:"choice",
    category:"🔤 Letters",
    question:"Can you find the letter " + l[0] + "?",
    visual:l[1],
    choices:letters.map(x=>x[0]),
    answer:index
  });
});

/* =========================================================
   10. BIG AND SMALL
========================================================= */

activities.push({
  type:"choice",
  category:"📏 Big & Small",
  question:"Which elephant is BIG?",
  visual:"🐘      🐘",
  choices:["🐘 BIG","🐘 SMALL"],
  answer:0
});

activities.push({
  type:"choice",
  category:"📏 Big & Small",
  question:"Which dog is SMALL?",
  visual:"🐶      🐕",
  choices:["🐶 BIG","🐕 SMALL"],
  answer:1
});

activities.push({
  type:"choice",
  category:"📏 Big & Small",
  question:"Which tree is TALL?",
  visual:"🌳      🌱",
  choices:["🌳 TALL","🌱 SHORT"],
  answer:0
});

/* =========================================================
   11. MATCHING
========================================================= */

const matching=[
  ["🐶","🐶","Dog"],
  ["🦁","🦁","Lion"],
  ["🍎","🍎","Apple"],
  ["⭐","⭐","Star"],
  ["🟡","🟡","Yellow"],
  ["🐟","🐟","Fish"]
];

matching.forEach(m=>{
  activities.push({
    type:"choice",
    category:"🧩 Matching",
    question:"Match the " + m[2] + "!",
    visual:m[0],
    choices:[m[0],m[1],"❌","❓"],
    answer:0
  });
});

/* =========================================================
   12. WHAT'S MISSING?
========================================================= */

const missing=[
  ["🍎 🍌 🍎 ❓","🍌"],
  ["🦁 🐘 🦁 ❓","🐘"],
  ["🔴 🔵 🔴 ❓","🔵"],
  ["⭐ 🌙 ⭐ ❓","🌙"],
  ["🐶 🐱 🐶 ❓","🐱"]
];

missing.forEach(m=>{
  activities.push({
    type:"choice",
    category:"🧠 What's Missing?",
    question:"What is missing?",
    visual:m[0],
    choices:[m[1],"🍎","🦁","⭐"],
    answer:0
  });
});

/* =========================================================
   13. BIG SAFARI HUNT
========================================================= */

const safariRounds=[
  ["Find the butterfly!","🦋"],
  ["Find the lion!","🦁"],
  ["Find the banana!","🍌"],
  ["Find the red flower!","🌹"],
  ["Find the elephant!","🐘"],
  ["Find the monkey!","🐒"],
  ["Find the yellow flower!","🌼"],
  ["Find the bird!","🐦"],
  ["Find the giraffe!","🦒"],
  ["Find the carrot!","🥕"],
  ["Find the bee!","🐝"],
  ["Find the pond!","💧"],
  ["Find the turtle!","🐢"],
  ["Find the apple!","🍎"],
  ["Find the zebra!","🦓"]
];

safariRounds.forEach(r=>{
  activities.push({
    type:"safari",
    category:"🌿 Safari Hunt",
    question:r[0],
    target:r[1]
  });
});

/* =========================================================
   GAME STATE
========================================================= */

let current=0;
let drawing=false;
let ctx;
let canvas;
let lineStarted=false;

function startGame(){
  current=0;

  document.getElementById("home").classList.add("hidden");
  document.getElementById("complete").classList.add("hidden");
  document.getElementById("game").classList.remove("hidden");

  renderActivity();
}

function restartGame(){
  document.getElementById("complete").classList.add("hidden");
  document.getElementById("home").classList.remove("hidden");
}

/* =========================================================
   RENDER
========================================================= */

function renderActivity(){

  if(current>=activities.length){
    finishGame();
    return;
  }

  const a=activities[current];

  document.getElementById("category").textContent=a.category;
  document.getElementById("question").textContent=a.question;
  document.getElementById("instruction").textContent=a.instruction || "";

  document.getElementById("feedback").textContent="";
  document.getElementById("feedback").className="feedback";

  const content=document.getElementById("activityContent");
  content.innerHTML="";

  updateProgress();

  if(a.type==="choice"){
    renderChoice(a);
  }

  if(a.type==="color"){
    renderColor(a);
  }

  if(a.type==="draw"){
    renderDraw(a);
  }

  if(a.type==="safari"){
    renderSafari(a);
  }

  speakCurrent();
}

/* =========================================================
   CHOICE ACTIVITY
========================================================= */

function renderChoice(a){

  if(a.visual){
    const visual=document.createElement("div");
    visual.className="visual";
    visual.textContent=a.visual;
    document.getElementById("activityContent").appendChild(visual);
  }

  const choices=document.createElement("div");
  choices.className="choices";

  a.choices.forEach((choice,index)=>{

    const btn=document.createElement("button");
    btn.className="choice";
    btn.textContent=choice;

    btn.onclick=()=>{

      if(index===a.answer){

        btn.classList.add("correct");
        correctFeedback();

        setTimeout(nextActivity,850);

      }else{

        btn.classList.add("wrong");
        tryAgain();
      }
    };

    choices.appendChild(btn);
  });

  document.getElementById("activityContent").appendChild(choices);
}

/* =========================================================
   COLOR ACTIVITY
========================================================= */

function renderColor(a){

  const colorsGrid=document.createElement("div");
  colorsGrid.className="choices";

  a.colorData.forEach((c,index)=>{

    const btn=document.createElement("button");
    btn.className="color-choice";
    btn.style.background=c[2];

    const label=document.createElement("span");
    label.className="color-label";
    label.textContent=c[0];

    btn.appendChild(label);

    btn.onclick=()=>{

      if(index===a.answer){

        btn.classList.add("correct");
        correctFeedback();
        setTimeout(nextActivity,850);

      }else{

        btn.classList.add("wrong");
        tryAgain();
      }
    };

    colorsGrid.appendChild(btn);
  });

  document.getElementById("activityContent").appendChild(colorsGrid);
}

/* =========================================================
   DRAWING ACTIVITY
========================================================= */

function renderDraw(a){

  const wrap=document.createElement("div");
  wrap.className="canvas-wrap";

  canvas=document.createElement("canvas");
  canvas.className="canvas-board";

  canvas.width=900;
  canvas.height=450;

  ctx=canvas.getContext("2d");

  wrap.appendChild(canvas);

  const mama=document.createElement("div");
  mama.className="animal-target mama";
  mama.textContent=a.question.includes("Dog") ? "🐶" : "🐱";
  wrap.appendChild(mama);

  const baby=document.createElement("div");
  baby.className="animal-target baby";
  baby.textContent=a.question.includes("Dog") ? "🐕" : "🐱";
  wrap.appendChild(baby);

  const ml=document.createElement("div");
  ml.className="target-label mama-label";
  ml.textContent="Mama";
  wrap.appendChild(ml);

  const bl=document.createElement("div");
  bl.className="target-label baby-label";
  bl.textContent="Baby";
  wrap.appendChild(bl);

  document.getElementById("activityContent").appendChild(wrap);

  const buttons=document.createElement("div");
  buttons.className="draw-buttons";

  const clear=document.createElement("button");
  clear.textContent="🧹 Clear";
  clear.onclick=clearDrawing;

  const done=document.createElement("button");
  done.textContent="✅ I'm Done!";
  done.onclick=finishDrawing;

  buttons.appendChild(clear);
  buttons.appendChild(done);

  document.getElementById("activityContent").appendChild(buttons);

  setupDrawing();
}

function setupDrawing(){

  drawing=false;
  lineStarted=false;

  canvas.addEventListener("pointerdown",startDrawing);
  canvas.addEventListener("pointermove",drawLine);
  canvas.addEventListener("pointerup",stopDrawing);
  canvas.addEventListener("pointercancel",stopDrawing);
}

function getPosition(e){

  const rect=canvas.getBoundingClientRect();

  return {
    x:(e.clientX-rect.left)*(canvas.width/rect.width),
    y:(e.clientY-rect.top)*(canvas.height/rect.height)
  };
}

function startDrawing(e){

  drawing=true;
  lineStarted=true;

  const p=getPosition(e);

  ctx.beginPath();
  ctx.moveTo(p.x,p.y);
}

function drawLine(e){

  if(!drawing) return;

  const p=getPosition(e);

  ctx.lineWidth=10;
  ctx.lineCap="round";
  ctx.lineJoin="round";
  ctx.strokeStyle="#e49b28";

  ctx.lineTo(p.x,p.y);
  ctx.stroke();
}

function stopDrawing(){
  drawing=false;
}

function clearDrawing(){

  if(ctx){
    ctx.clearRect(0,0,canvas.width,canvas.height);
  }

  lineStarted=false;
}

function finishDrawing(){

  if(!lineStarted){

    tryAgain();
    return;
  }

  correctFeedback();

  setTimeout(nextActivity,1000);
}

/* =========================================================
   SAFARI HUNT
========================================================= */

function renderSafari(a){

  const scene=document.createElement("div");
  scene.className="safari";

  scene.innerHTML=`
    <div class="sun">☀️</div>
    <div class="cloud cloud1">☁️</div>
    <div class="cloud cloud2">☁️</div>

    <div class="tree tree1">🌴</div>
    <div class="tree tree2">🌳</div>
    <div class="tree tree3">🌳</div>
    <div class="tree tree4">🌴</div>

    <div class="pond">💧</div>
  `;

  const objects=[
    "🦋","🦁","🍌","🌹","🐘","🐒","🌼",
    "🐦","🦒","🥕","🐝","💧","🐢","🍎",
    "🦓","🐯","🐆","🐰","🐍","🐟","🐔",
    "🌸","🍉","🥥","⭐","🪨","🌿"
  ];

  shuffle(objects);

  const positions=[
    [8,18],[20,28],[34,15],[49,27],[64,16],
    [78,30],[13,53],[27,66],[43,48],[58,63],
    [73,50],[88,62],[7,75],[19,40],[35,76],
    [51,37],[68,75],[83,43],[31,25],[55,18],
    [91,25],[45,78],[76,20],[10,35],[61,35],
    [87,75],[39,58]
  ];

  objects.forEach((obj,index)=>{

    const button=document.createElement("button");

    button.className="safari-object";
    button.textContent=obj;

    const pos=positions[index];

    button.style.left=pos[0]+"%";
    button.style.top=pos[1]+"%";

    button.onclick=()=>{

      if(obj===a.target){

        button.classList.add("found");
        button.disabled=true;

        correctFeedback();

        setTimeout(nextActivity,1000);

      }else{

        tryAgain();
      }
    };

    scene.appendChild(button);
  });

  document.getElementById("activityContent").appendChild(scene);

  const hint=document.createElement("div");
  hint.className="hint";
  hint.textContent="🔎 Look carefully! There are many things hiding in the safari.";
  document.getElementById("activityContent").appendChild(hint);
}

/* =========================================================
   FEEDBACK
========================================================= */

function correctFeedback(){

  const f=document.getElementById("feedback");

  const messages=[
    "🎉 Good job, Orion!",
    "🌟 Amazing!",
    "👏 You did it!",
    "🦁 Great job!",
    "⭐ Wonderful!",
    "🎊 Yay, Orion!"
  ];

  f.textContent=messages[Math.floor(Math.random()*messages.length)];
  f.className="feedback good";

  speak(f.textContent);
}

function tryAgain(){

  const f=document.getElementById("feedback");

  f.textContent="🔎 Try again! You can do it!";
  f.className="feedback try";

  speak("Try again. You can do it!");
}

/* =========================================================
   NEXT
========================================================= */

function nextActivity(){

  current++;

  if(current>=activities.length){

    finishGame();

  }else{

    renderActivity();
  }
}

/* =========================================================
   PROGRESS
========================================================= */

function updateProgress(){

  const percent=(current/activities.length)*100;

  document.getElementById("progressBar").style.width=percent+"%";

  document.getElementById("progressText").textContent=
    "Activity " + (current+1) + " of " + activities.length;
}

/* =========================================================
   FINISH
========================================================= */

function finishGame(){

  document.getElementById("game").classList.add("hidden");
  document.getElementById("complete").classList.remove("hidden");

  createConfetti();

  setTimeout(()=>{
    speak("Good job Orion! You finished your Kindergarten Safari!");
  },300);
}

/* =========================================================
   CONFETTI
========================================================= */

function createConfetti(){

  const pieces=[
    "🎉","🎊","⭐","🌟","🦁","🦋",
    "🌈","❤️","🍌","🎈","👏","✨"
  ];

  for(let i=0;i<70;i++){

    const piece=document.createElement("div");

    piece.className="confetti";
    piece.textContent=pieces[Math.floor(Math.random()*pieces.length)];

    piece.style.left=Math.random()*100+"%";
    piece.style.animationDelay=Math.random()*2+"s";
    piece.style.fontSize=(18+Math.random()*22)+"px";

    document.body.appendChild(piece);

    setTimeout(()=>{
      piece.remove();
    },5000);
  }
}

/* =========================================================
   SPEECH
========================================================= */

function speak(text){

  if(!("speechSynthesis" in window)) return;

  window.speechSynthesis.cancel();

  const utterance=new SpeechSynthesisUtterance(text);

  utterance.rate=.85;
  utterance.pitch=1.1;

  window.speechSynthesis.speak(utterance);
}

function speakCurrent(){

  setTimeout(()=>{

    const a=activities[current];

    if(a){
      speak(a.question);
    }

  },250);
}

/* =========================================================
   FULLSCREEN
========================================================= */

function goFullscreen(){

  const element=document.documentElement;

  if(element.requestFullscreen){

    element.requestFullscreen().catch(()=>{});

  }else if(element.webkitRequestFullscreen){

    element.webkitRequestFullscreen();
  }
}

/* =========================================================
   ROTATION
========================================================= */

function rotateScreen(){

  if(screen.orientation && screen.orientation.lock){

    screen.orientation.lock("landscape").catch(()=>{

      alert("Please turn your phone sideways for the best view. 📱↔️");
    });

  }else{

    alert("Please turn your phone sideways for the best view. 📱↔️");
  }
}

/* =========================================================
   SHUFFLE
========================================================= */

function shuffle(array){

  for(let i=array.length-1;i>0;i--){

    const j=Math.floor(Math.random()*(i+1));

    [array[i],array[j]]=[array[j],array[i]];
  }

  return array;
}
