<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Orion's Safari Kindergarten 🌿🦁</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  font-family:Arial, Helvetica, sans-serif;
  background:#eaf7df;
  color:#29452b;
  overflow:hidden;
}

button{
  font-family:inherit;
  border:none;
  cursor:pointer;
  touch-action:manipulation;
}

.screen{
  display:none;
  width:100%;
  height:100%;
  overflow:auto;
}

.screen.active{
  display:block;
}

/* HOME */
#home{
  min-height:100%;
  background:
    radial-gradient(circle at 10% 20%, #fff7b2 0 8%, transparent 9%),
    radial-gradient(circle at 90% 15%, #d5f3bb 0 9%, transparent 10%),
    linear-gradient(#dff6c9,#fff8dc);
  text-align:center;
  padding:25px 18px;
}

.homeAnimals{
  font-size:clamp(38px,8vw,75px);
  margin-top:8px;
  animation:bounce 2s infinite;
}

@keyframes bounce{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-8px)}
}

.logo{
  font-size:clamp(34px,8vw,70px);
  font-weight:900;
  color:#477b38;
  text-shadow:3px 3px 0 #fff;
  margin:12px 0 4px;
}

.subtitle{
  font-size:clamp(18px,4vw,30px);
  color:#76592f;
  font-weight:bold;
}

.startBtn{
  margin-top:30px;
  padding:18px 42px;
  border-radius:30px;
  background:#71b84c;
  color:white;
  font-size:clamp(20px,4vw,30px);
  font-weight:900;
  box-shadow:0 7px 0 #4e8933;
}

.startBtn:active{
  transform:translateY(5px);
  box-shadow:0 2px 0 #4e8933;
}

.homeHint{
  margin:25px auto;
  max-width:650px;
  background:#ffffffd9;
  border-radius:25px;
  padding:18px;
  font-size:17px;
  line-height:1.5;
}

/* TOP BAR */
.topbar{
  position:sticky;
  top:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:5px;
  padding:7px;
  background:#477d38;
  color:white;
}

.topbar button{
  background:#ffffff22;
  color:white;
  border-radius:12px;
  padding:9px 12px;
  font-size:14px;
  font-weight:bold;
}

.topTitle{
  font-size:15px;
  font-weight:900;
}

/* MENU */
#menu{
  background:
    linear-gradient(#e9f9d9,#fff7dc);
}

.menuContent{
  padding:15px;
  max-width:900px;
  margin:auto;
}

.menuTitle{
  text-align:center;
  font-size:clamp(28px,6vw,45px);
  margin:8px 0;
  color:#4d7d39;
}

.menuSub{
  text-align:center;
  margin-bottom:15px;
  font-size:17px;
}

.menuGrid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(145px,1fr));
  gap:12px;
  padding-bottom:30px;
}

.menuBtn{
  min-height:115px;
  border-radius:24px;
  background:white;
  box-shadow:0 4px 12px #456c3925;
  border:3px solid #d2e8bd;
  padding:12px 7px;
  font-size:17px;
  font-weight:900;
  color:#345b34;
}

.menuBtn .icon{
  display:block;
  font-size:43px;
  margin-bottom:6px;
}

.menuBtn:active{
  transform:scale(.96);
  background:#f4ffe9;
}

/* ACTIVITY */
.activity{
  min-height:100%;
  background:
    linear-gradient(#f4ffe9,#fff9df);
}

.activityInner{
  width:min(1100px,100%);
  margin:auto;
  padding:12px 15px 30px;
}

.activityHeader{
  text-align:center;
  background:#ffffffdc;
  border-radius:22px;
  padding:10px;
  margin-bottom:10px;
}

.activityTitle{
  margin:0;
  font-size:clamp(24px,5vw,38px);
  color:#4c7d39;
}

.question{
  font-size:clamp(20px,4vw,29px);
  font-weight:900;
  margin:8px 0;
}

.listenBtn{
  background:#f3b84b;
  color:#4b3415;
  padding:9px 16px;
  border-radius:20px;
  font-weight:900;
  font-size:15px;
}

.progressOuter{
  height:12px;
  background:#dce8d4;
  border-radius:20px;
  overflow:hidden;
  margin:8px 0;
}

.progressInner{
  height:100%;
  width:0%;
  background:#70b84c;
  transition:.3s;
}

/* GENERAL CHOICES */
.choices{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  gap:15px;
  max-width:850px;
  margin:15px auto;
}

.choice{
  min-height:120px;
  background:white;
  border-radius:24px;
  border:4px solid #d9e9cc;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:65px;
  box-shadow:0 4px 10px #345b3420;
}

.choice:active{
  transform:scale(.95);
}

.feedback{
  text-align:center;
  min-height:45px;
  font-size:25px;
  font-weight:900;
  padding:8px;
}

.correct{
  color:#388438;
}

.wrong{
  color:#c45a43;
}

/* BODY */
.bodyChoices .choice{
  font-size:42px;
  min-height:90px;
}

/* COLOR */
.colorSample{
  width:min(280px,55vw);
  height:min(220px,35vh);
  border-radius:35px;
  margin:15px auto;
  border:8px solid white;
  box-shadow:0 5px 15px #0002;
}

.colorChoices{
  grid-template-columns:repeat(5,1fr);
  max-width:650px;
}

.colorChoice{
  min-height:80px;
  border-radius:20px;
  border:5px solid white;
  box-shadow:0 3px 9px #0002;
}

@media(max-width:550px){
  .colorChoices{
    grid-template-columns:repeat(5,1fr);
    gap:7px;
  }
  .colorChoice{
    min-height:55px;
  }
}

/* COUNTING */
.countObjects{
  text-align:center;
  background:white;
  border-radius:28px;
  padding:15px;
  margin:10px auto;
  max-width:800px;
  min-height:180px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
  gap:8px;
  font-size:clamp(45px,9vw,80px);
}

.numberChoices{
  grid-template-columns:repeat(5,1fr);
  max-width:600px;
}

.numberChoice{
  min-height:75px;
  font-size:30px;
}

/* BIG SMALL */
.bigSmallChoice{
  font-size:70px;
}

/* FOOD */
.foodAnimal{
  text-align:center;
  font-size:clamp(90px,18vw,150px);
  background:white;
  border-radius:30px;
  padding:8px;
  max-width:350px;
  margin:auto;
}

.foodChoice{
  font-size:70px;
}

/* MISSING */
.pattern{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  background:white;
  border-radius:28px;
  padding:20px;
  max-width:850px;
  margin:15px auto;
  font-size:clamp(48px,9vw,75px);
}

.patternItem{
  width:75px;
  height:75px;
  display:flex;
  justify-content:center;
  align-items:center;
  border-radius:15px;
  background:#f1f8e9;
}

.missingChoices{
  max-width:650px;
}

/* MATCH PICTURES */
.pictureMatchBoard{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  max-width:700px;
  margin:auto;
}

.matchColumn{
  display:grid;
  gap:10px;
}

.matchPicture{
  min-height:90px;
  background:white;
  border:4px solid #d5e7c7;
  border-radius:20px;
  font-size:55px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.matchPicture.selected{
  border-color:#e8a43c;
  background:#fff6d9;
}

.matchPicture.matched{
  border-color:#71b84c;
  background:#e9f8dc;
  opacity:.75;
}

/* MAMA BABY */
.lineMatchWrap{
  position:relative;
  width:100%;
  max-width:1000px;
  margin:auto;
  background:#fffdf1;
  border-radius:25px;
  border:4px solid #d4e5c5;
  overflow:hidden;
  padding:15px 10px;
}

.lineLabels{
  display:grid;
  grid-template-columns:1fr 1fr;
  text-align:center;
  font-size:18px;
  font-weight:900;
  color:#557743;
  margin-bottom:7px;
}

.mamaBabyBoard{
  position:relative;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px 35%;
  min-height:420px;
}

.mamaColumn,.babyColumn{
  display:flex;
  flex-direction:column;
  justify-content:space-around;
  gap:7px;
  z-index:3;
}

.mamaItem,.babyItem{
  height:60px;
  background:white;
  border:3px solid #d9e7ce;
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:43px;
  position:relative;
  user-select:none;
}

.endpoint{
  position:absolute;
  width:17px;
  height:17px;
  border-radius:50%;
  background:#71b84c;
  border:3px solid white;
  top:50%;
  transform:translateY(-50%);
}

.mamaItem .endpoint{
  right:-11px;
}

.babyItem .endpoint{
  left:-11px;
  background:#e9a43c;
}

#connectionCanvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:4;
  touch-action:none;
}

.lineControls{
  display:flex;
  justify-content:center;
  gap:10px;
  margin:12px auto;
  flex-wrap:wrap;
}

.controlBtn{
  background:#6daa49;
  color:white;
  padding:12px 20px;
  border-radius:20px;
  font-weight:900;
  font-size:16px;
}

.clearBtn{
  background:#d9865b;
}

/* TRACING */
.traceBoard{
  width:min(900px,100%);
  height:min(60vh,520px);
  min-height:300px;
  background:white;
  border:5px solid #d5e8c7;
  border-radius:30px;
  position:relative;
  margin:10px auto;
  overflow:hidden;
  touch-action:none;
}

.traceCanvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  touch-action:none;
}

.traceTools{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin:8px;
}

/* PREWRITING */
.preGuide{
  font-size:90px;
  color:#a9c39a;
}

/* LETTER / NUMBER */
.traceGlyph{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:min(58vw,330px);
  font-weight:900;
  color:transparent;
  -webkit-text-stroke:5px #a9c69b;
  text-shadow:
    2px 0 #a9c69b,
    -2px 0 #a9c69b,
    0 2px #a9c69b,
    0 -2px #a9c69b;
  opacity:.75;
  pointer-events:none;
}

.traceDots{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:none;
  color:#b0c8a4;
  font-weight:900;
  font-size:min(58vw,330px);
  opacity:.35;
}

/* HUNT */
.huntScene{
  min-height:500px;
  background:
    radial-gradient(circle at 10% 15%, #fff0a8 0 5%,transparent 6%),
    linear-gradient(#bce6f3 0 35%,#a9d87b 35% 70%,#5f9a4e 70%);
  border-radius:30px;
  position:relative;
  overflow:hidden;
  max-width:1000px;
  margin:auto;
}

.huntItem{
  position:absolute;
  font-size:clamp(35px,7vw,65px);
  background:none;
  padding:3px;
  z-index:2;
}

.huntTarget{
  animation:pulse 1.2s infinite;
}

@keyframes pulse{
  50%{transform:scale(1.18)}
}

/* FINISH */
.finish{
  text-align:center;
  padding:30px 15px;
  max-width:700px;
  margin:auto;
}

.finishEmoji{
  font-size:100px;
  animation:bounce 1.5s infinite;
}

.finish h2{
  font-size:40px;
  color:#4f7d3d;
}

.finish p{
  font-size:21px;
}

.nextBtn{
  background:#70b84c;
  color:white;
  padding:14px 25px;
  border-radius:22px;
  font-size:19px;
  font-weight:900;
  margin:5px;
}

.menuReturn{
  background:#e9a345;
}

/* SAFETY */
@media(orientation:landscape) and (max-height:600px){
  .activityInner{
    padding-top:5px;
  }

  .activityHeader{
    padding:5px;
  }

  .countObjects{
    min-height:120px;
    margin:5px auto;
  }

  .choice{
    min-height:85px;
  }

  .traceBoard{
    height:70vh;
  }
}
</style>
</head>

<script>

/* =========================================================
   BASIC NAVIGATION
========================================================= */

function hideAll(){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
}

function showHome(){
  speechSynthesis.cancel();
  hideAll();
  document.getElementById("home").classList.add("active");
}

function showMenu(){
  speechSynthesis.cancel();
  hideAll();
  document.getElementById("menu").classList.add("active");
}

function goFullscreen(){
  const el=document.documentElement;
  if(el.requestFullscreen){
    el.requestFullscreen().catch(()=>{});
  }else if(el.webkitRequestFullscreen){
    el.webkitRequestFullscreen();
  }
}

async function rotateScreen(){
  try{
    if(screen.orientation && screen.orientation.lock){
      await screen.orientation.lock("landscape");
    }else{
      alert("Please turn the phone sideways ↔️");
    }
  }catch(e){
    alert("Please turn the phone sideways ↔️");
  }
}

/* =========================================================

function shuffle(array){
  return [...array].sort(()=>Math.random()-.5);
}

function setTitle(title,question){
  document.getElementById("activityTitle").textContent=title;
  document.getElementById("topActivityTitle").textContent=title;
  document.getElementById("question").textContent=question||"";
}

function setFeedback(text="",type=""){
  const f=document.getElementById("feedback");
  f.textContent=text;
  f.className="feedback "+type;
}

function updateProgress(){
  let total=currentData.length||1;
  let pct=((currentIndex)/total)*100;
  document.getElementById("progressInner").style.width=pct+"%";
}

function speak(text){
  if(!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.rate=.82;
  u.pitch=1.1;
  speechSynthesis.speak(u);
}

function speakQuestion(){
  const q=document.getElementById("question").textContent;
  if(q) speak(q);
}

function success(message="Great job! 🌟"){
  setFeedback(message,"correct");
  setTimeout(nextQuestion,800);
}

function wrong(){
  setFeedback("Try again! 💚","wrong");
}


/* =========================================================
   START ACTIVITY
========================================================= */

function startActivity(type){

  speechSynthesis.cancel();

  currentType=type;
  currentIndex=0;
  playEverything=(type==="everything");

  if(type==="everything"){
    everythingQueue=[
      "body",
      "colors",
      "shapes",
      "counting",
      "animals",
      "sounds",
      "food",
      "mamababy",
      "matching",
      "prewriting",
      "numbers",
      "letters",
      "bigsmall",
      "missing",
      "hunt"
    ];
    everythingPosition=0;
    currentType=everythingQueue[0];
  }

  hideAll();
  document.getElementById("activity").classList.add("active");

  prepareActivity(currentType);
}


/* =========================================================
   PREPARE
========================================================= */

function prepareActivity(type){

  currentIndex=0;
  setFeedback("");

  if(type==="body") currentData=shuffle(bodyParts);
  else if(type==="colors") currentData=shuffle(colors);
  else if(type==="shapes") currentData=shuffle(shapes);
  else if(type==="counting") currentData=shuffle(counting);
  else if(type==="animals") currentData=shuffle(animals);
  else if(type==="sounds") currentData=shuffle(sounds);
  else if(type==="food") currentData=shuffle(foods);
  else if(type==="mamababy"){
    prepareMamaBaby();
    return;
  }
  else if(type==="matching"){
    prepareMatching();
    return;
  }
  else if(type==="prewriting"){
    currentData=prewriting;
  }
  else if(type==="numbers"){
    currentData=numberList;
  }
  else if(type==="letters"){
    currentData=letterList;
  }
  else if(type==="bigsmall") currentData=shuffle(bigSmall);
  else if(type==="missing") currentData=shuffle(
    missing.map((x,i)=>({pattern:x,answer:missingAnswers[missing.indexOf(x)]}))
  );
  else if(type==="hunt"){
    currentData=Array.from({length:10},(_,i)=>i);
  }

  renderQuestion();
}

function prepareMamaBaby(){

  currentIndex=0;

  const shuffledPairs=shuffle(mamaPairs);

  mamaRound=shuffledPairs.slice(0,6);
  const babies=shuffle(mamaRound.map((p,i)=>({
    emoji:p[1],
    pairIndex:i
  })));

  setTitle(
    "🐘 Mama & Baby",
    "Draw a line from each Mama to her Baby!"
  );

  const box=document.getElementById("activityContent");

  box.innerHTML=`
    <div class="lineMatchWrap">

      <div class="lineLabels">
        <div>🐾 MAMA</div>
        <div>🐾 BABY</div>
      </div>

      <div class="mamaBabyBoard" id="mamaBabyBoard">

        <div class="mamaColumn" id="mamaColumn">
          ${mamaRound.map((p,i)=>`
            <div class="mamaItem"
                 data-index="${i}"
                 data-side="mama">
              ${p[0]}
              <span class="endpoint"></span>
            </div>
          `).join("")}
        </div>

        <div class="babyColumn" id="babyColumn">
          ${babies.map((b,i)=>`
            <div class="babyItem"
                 data-index="${b.pairIndex}"
                 data-side="baby">
              ${b.emoji}
              <span class="endpoint"></span>
            </div>
          `).join("")}
        </div>

        <canvas id="connectionCanvas"></canvas>

      </div>
    </div>

    <div class="lineControls">
      <button class="controlBtn clearBtn" onclick="clearMamaLines()">↩️ Clear Lines</button>
      <button class="controlBtn" onclick="checkMamaLines()">✅ Done!</button>
    </div>

    <div style="text-align:center;font-size:16px">
      💚 Touch a Mama, then drag to her Baby.
    </div>
  `;

  setupMamaCanvas();
  speakQuestion();
}

function setupMamaCanvas(){

  const board=document.getElementById("mamaBabyBoard");
  const canvas=document.getElementById("connectionCanvas");

  const rect=board.getBoundingClientRect();

  canvas.width=rect.width*devicePixelRatio;
  canvas.height=rect.height*devicePixelRatio;

  canvas.style.width=rect.width+"px";
  canvas.style.height=rect.height+"px";

  const ctx=canvas.getContext("2d");
  ctx.scale(devicePixelRatio,devicePixelRatio);

  mamaConnections=[];
  let active=null;

  function pointFromEvent(e){
    const r=canvas.getBoundingClientRect();
    return {
      x:e.clientX-r.left,
      y:e.clientY-r.top
    };
  }

  function endpointFor(el){

    const er=el.getBoundingClientRect();
    const br=board.getBoundingClientRect();

    return {
      x:er.left+er.width/2-br.left,
      y:er.top+er.height/2-br.top
    };
  }

  function nearestBaby(point){

    const babies=[...document.querySelectorAll(".babyItem")];

    let best=null;
    let bestDist=70;

    babies.forEach(el=>{
      const p=endpointFor(el);
      const d=Math.hypot(p.x-point.x,p.y-point.y);

      if(d<bestDist){
        best=el;
        bestDist=d;
      }
    });

    return best;
  }

  canvas.onpointerdown=function(e){

    e.preventDefault();

    const p=pointFromEvent(e);

    const mamas=[...document.querySelectorAll(".mamaItem")];

    let best=null;
    let dist=65;

    mamas.forEach(el=>{
      const ep=endpointFor(el);
      const d=Math.hypot(ep.x-p.x,ep.y-p.y);

      if(d<dist){
        best=el;
        dist=d;
      }
    });

    if(!best)return;

    active={
      mama:best,
      start:endpointFor(best),
      current:p
    };

    canvas.setPointerCapture(e.pointerId);
  };

  canvas.onpointermove=function(e){

    if(!active)return;

    e.preventDefault();

    active.current=pointFromEvent(e);
    redrawMamaCanvas(ctx,canvas,active);
  };

  canvas.onpointerup=function(e){

    if(!active)return;

    const end=pointFromEvent(e);
    const baby=nearestBaby(end);

    if(baby){

      const mamaIndex=Number(active.mama.dataset.index);
      const babyIndex=Number(baby.dataset.index);

      mamaConnections=mamaConnections.filter(c=>c.mama!==mamaIndex);

      mamaConnections.push({
        mama:mamaIndex,
        baby:babyIndex
      });
    }

    active=null;
    redrawMamaCanvas(ctx,canvas,null);
  };

  window._mamaCanvas=canvas;
  window._mamaCtx=ctx;
}

function redrawMamaCanvas(ctx,canvas,active){

  const board=document.getElementById("mamaBabyBoard");
  if(!board)return;

  const rect=canvas.getBoundingClientRect();

  ctx.clearRect(0,0,rect.width,rect.height);

  function endpointFor(el){

    const er=el.getBoundingClientRect();
    const br=board.getBoundingClientRect();

    return {
      x:er.left+er.width/2-br.left,
      y:er.top+er.height/2-br.top
    };
  }

  mamaConnections.forEach(c=>{

    const mama=document.querySelector(
      `.mamaItem[data-index="${c.mama}"]`
    );

    const baby=document.querySelector(
      `.babyItem[data-index="${c.baby}"]`
    );

    if(!mama||!baby)return;

    const a=endpointFor(mama);
    const b=endpointFor(baby);

    ctx.beginPath();
    ctx.moveTo(a.x,a.y);
    ctx.lineTo(b.x,b.y);
    ctx.lineWidth=7;
    ctx.lineCap="round";
    ctx.strokeStyle="#71a94f";
    ctx.stroke();
  });

  if(active){

    ctx.beginPath();
    ctx.moveTo(active.start.x,active.start.y);
    ctx.lineTo(active.current.x,active.current.y);
    ctx.lineWidth=7;
    ctx.lineCap="round";
    ctx.strokeStyle="#e9a23d";
    ctx.stroke();
  }
}

function clearMamaLines(){
  mamaConnections=[];
  if(window._mamaCtx && window._mamaCanvas)
    redrawMamaCanvas(window._mamaCtx,window._mamaCanvas,null);
}

function checkMamaLines(){

  if(mamaConnections.length<mamaRound.length){
    setFeedback("Connect all the Mamas first! 💚","wrong");
    return;
  }

  const correct=mamaConnections.every(c=>c.mama===c.baby);

  if(correct){
    setFeedback("Amazing! All the Mamas found their babies! 🥰","correct");
    setTimeout(nextQuestion,1200);
  }else{
    setFeedback("Some babies need another look! Try again. 💚","wrong");
  }
}

function prepareMatching(){

  const selected=shuffle(animals).slice(0,6);

  matchPairs=selected;
  selectedMatch=null;

  const right=shuffle(selected);

  setTitle(
    "🧩 Match Pictures",
    "Find the two pictures that are the same!"
  );

  document.getElementById("activityContent").innerHTML=`

    <div class="pictureMatchBoard">

      <div class="matchColumn" id="matchLeft">
        ${selected.map((x,i)=>`
          <button class="matchPicture"
            data-side="left"
            data-value="${x[1]}"
            onclick="selectMatch(this)">
            ${x[0]}
          </button>
        `).join("")}
      </div>

      <div class="matchColumn" id="matchRight">
        ${right.map((x,i)=>`
          <button class="matchPicture"
            data-side="right"
            data-value="${x[1]}"
            onclick="selectMatch(this)">
            ${x[0]}
          </button>
        `).join("")}
      </div>

    </div>

    <div style="text-align:center;margin-top:12px;font-size:17px">
      👆 Tap one picture, then tap its matching picture.
    </div>
  `;

  speakQuestion();
}

function selectMatch(el){

  if(el.classList.contains("matched"))return;

  if(!selectedMatch){

    selectedMatch=el;
    el.classList.add("selected");
    return;
  }

  if(selectedMatch===el){
    el.classList.remove("selected");
    selectedMatch=null;
    return;
  }

  const first=selectedMatch;
  const second=el;

  if(first.dataset.value===second.dataset.value &&
     first.dataset.side!==second.dataset.side){

    first.classList.remove("selected");
    first.classList.add("matched");

    second.classList.add("matched");

    selectedMatch=null;

    const remaining=[
      ...document.querySelectorAll(".matchPicture:not(.matched)")
    ];

    if(remaining.length===0){
      setFeedback("You matched them all! 🧩🎉","correct");
      setTimeout(nextQuestion,1000);
    }else{
      setFeedback("Match! ⭐","correct");
    }

  }else{

    first.classList.remove("selected");
    selectedMatch=null;
    setFeedback("Look carefully! 💚","wrong");
  }
}

    <div class="traceBoard" id="traceBoard">

      <div class="traceGlyph">
        ${target}
      </div>

      <canvas id="traceCanvas" class="traceCanvas"></canvas>
    </div>

    <div class="traceTools">
      <button class="controlBtn clearBtn" onclick="clearTrace()">↩️ Clear</button>
      <button class="controlBtn" onclick="finishTrace()">⭐ Done</button>
    </div>
  `;

  setupTraceCanvas();
  speakQuestion();
}


/* =========================================================
   TRACE CANVAS
========================================================= */

function setupTraceCanvas(){

  traceCanvas=document.getElementById("traceCanvas");
  if(!traceCanvas)return;

  const board=document.getElementById("traceBoard");
  const rect=board.getBoundingClientRect();

  traceCanvas.width=rect.width*devicePixelRatio;
  traceCanvas.height=rect.height*devicePixelRatio;

  traceCanvas.style.width=rect.width+"px";
  traceCanvas.style.height=rect.height+"px";

  traceCtx=traceCanvas.getContext("2d");
  traceCtx.scale(devicePixelRatio,devicePixelRatio);

  drawing=false;
  traceDistance=0;

  traceCanvas.onpointerdown=function(e){

    e.preventDefault();
    drawing=true;
    traceDistance=0;

    const p=getTracePoint(e);

    traceCtx.beginPath();
    traceCtx.moveTo(p.x,p.y);

    traceCanvas.setPointerCapture(e.pointerId);
  };

  traceCanvas.onpointermove=function(e){

    if(!drawing)return;

    e.preventDefault();

    const p=getTracePoint(e);

    traceCtx.lineTo(p.x,p.y);
    traceCtx.lineWidth=9;
    traceCtx.lineCap="round";
    traceCtx.lineJoin="round";
    traceCtx.strokeStyle="#62a34a";
    traceCtx.stroke();

    traceDistance+=12;
  };

  traceCanvas.onpointerup=function(e){

    drawing=false;

    if(traceDistance>70){
      setFeedback("Great tracing! ✏️🌟","correct");
    }
  };

  traceCanvas.onpointercancel=function(){
    drawing=false;
  };
}

function getTracePoint(e){

  const r=traceCanvas.getBoundingClientRect();

  return {
    x:e.clientX-r.left,
    y:e.clientY-r.top
  };
}

function clearTrace(){

  if(!traceCtx||!traceCanvas)return;

  traceCtx.clearRect(
    0,
    0,
    traceCanvas.width,
    traceCanvas.height
  );

  setFeedback("");
  traceDistance=0;
}

function finishTrace(){

  if(traceDistance>50){
    setFeedback("Wonderful tracing! 🌟","correct");
    setTimeout(nextQuestion,900);
  }else{
    setFeedback("Use your finger or stylus to trace it! ✏️","wrong");
  }
}
